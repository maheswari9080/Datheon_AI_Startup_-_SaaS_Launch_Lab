<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <style>
    .arch-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; }
    .arch-subtitle { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #64748b; }
    .step-badge { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #4f46e5; text-transform: uppercase; }
    .step-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
    .step-desc { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; line-height: 1.5; }
    .tech-pill { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #334155; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="540" rx="16" fill="url(#archBg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Title -->
  <text x="48" y="55" class="arch-title">DealForge AI — End-to-End <tspan fill="url(#headerGrad)">System Architecture</tspan></text>
  <text x="48" y="82" class="arch-subtitle">Complete modular pipeline uniting discovery intake, predictive risk analysis, interactive viewing, and Stripe test closing.</text>

  <!-- Step 1: Intake & Discovery -->
  <g transform="translate(48, 120)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="245" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="22" rx="4" fill="#e0e7ff"/>
    <text x="24" y="31" class="step-badge">STAGE 1</text>
    <text x="16" y="65" class="step-title">Discovery Intake</text>
    <text x="16" y="90" class="step-desc">• Raw meeting transcripts</text>
    <text x="16" y="112" class="step-desc">• Rough client bullet points</text>
    <text x="16" y="134" class="step-desc">• Contract value &amp; timeline</text>
    <text x="16" y="156" class="step-desc">• Team size &amp; tech stack</text>

    <!-- Tech tags -->
    <rect x="16" y="215" width="105" height="24" rx="4" fill="#f1f5f9"/>
    <text x="24" y="231" class="tech-pill">REST API / JSON</text>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(303, 240)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="35,0 27,-5 27,5" fill="#94a3b8"/>
  </g>

  <!-- Step 2: AI Scope Risk Radar -->
  <g transform="translate(348, 120)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="245" height="260" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="16" y="16" width="70" height="22" rx="4" fill="#e0e7ff"/>
    <text x="24" y="31" class="step-badge">STAGE 2</text>
    <text x="16" y="65" class="step-title">Scope Risk Radar</text>
    <text x="16" y="90" class="step-desc">• 11 Ambiguity triggers</text>
    <text x="16" y="112" class="step-desc">• Sprint compression ratio</text>
    <text x="16" y="134" class="step-desc">• Composite score (1-100)</text>
    <text x="16" y="156" class="step-desc">• Buffer injection (+15-35%)</text>

    <!-- Tech tags -->
    <rect x="16" y="215" width="125" height="24" rx="4" fill="#ede9fe"/>
    <text x="24" y="231" class="tech-pill" fill="#6d28d9">Heuristic Radar</text>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(603, 240)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="35,0 27,-5 27,5" fill="#94a3b8"/>
  </g>

  <!-- Step 3: Interactive Proposal Viewer -->
  <g transform="translate(648, 120)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="245" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="22" rx="4" fill="#e0e7ff"/>
    <text x="24" y="31" class="step-badge">STAGE 3</text>
    <text x="16" y="65" class="step-title">Proposal Studio</text>
    <text x="16" y="90" class="step-desc">• Structured deliverables</text>
    <text x="16" y="112" class="step-desc">• Phased milestone escrow</text>
    <text x="16" y="134" class="step-desc">• Protective legal terms</text>
    <text x="16" y="156" class="step-desc">• Tokenized client URL</text>

    <!-- Tech tags -->
    <rect x="16" y="215" width="135" height="24" rx="4" fill="#f0fdf4"/>
    <text x="24" y="231" class="tech-pill" fill="#15803d">Mobile Responsive</text>
  </g>

  <!-- Connector 3 -->
  <g transform="translate(903, 240)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="35,0 27,-5 27,5" fill="#94a3b8"/>
  </g>

  <!-- Step 4: Stripe Instant Deposit -->
  <g transform="translate(948, 120)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="204" height="260" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="22" rx="4" fill="#dcfce7"/>
    <text x="24" y="31" class="step-badge" fill="#15803d">STAGE 4</text>
    <text x="16" y="65" class="step-title">Stripe Checkout</text>
    <text x="16" y="90" class="step-desc">• Server-side price lock</text>
    <text x="16" y="112" class="step-desc">• Digital acceptance box</text>
    <text x="16" y="134" class="step-desc">• HMAC-SHA256 webhook</text>
    <text x="16" y="156" class="step-desc">• Instant deposit unlock</text>

    <!-- Tech tags -->
    <rect x="16" y="215" width="130" height="24" rx="4" fill="#e0f2fe"/>
    <text x="24" y="231" class="tech-pill" fill="#0369a1">Stripe Test Mode</text>
  </g>

  <!-- Lower Security & Governance Tier -->
  <g transform="translate(48, 410)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="1104" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a">SECURITY, PERSISTENCE &amp; TENANT ISOLATION LAYER</text>
    <text x="24" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#64748b">
      Bcrypt (10 Salt Rounds) • Stateless JWT Session Auth • Row-Level Tenant Security • Replay-Protected Webhook HMAC • ACID Atomic JSON Storage
    </text>

    <!-- Status Badge -->
    <rect x="940" y="28" width="140" height="32" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="962" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#15803d">✓ Zero Watermark</text>
  </g>
</svg>
