<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="cardGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="cardGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 34px; font-weight: 800; fill: #0f172a; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #475569; }
    .badge-text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #4f46e5; letter-spacing: 0.5px; text-transform: uppercase; }
    .card-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
    .card-text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #64748b; line-height: 1.5; }
    .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 800; }
    .stat-lbl { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; fill: #64748b; }
  </style>

  <!-- Outer Canvas with subtle light border -->
  <rect x="0" y="0" width="1200" height="480" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Decorative Subtle Glow Circles -->
  <circle cx="150" cy="80" r="120" fill="#4f46e5" opacity="0.05" filter="blur(40px)"/>
  <circle cx="1050" cy="120" r="140" fill="#0891b2" opacity="0.05" filter="blur(40px)"/>

  <!-- Header Badge -->
  <rect x="48" y="40" width="220" height="28" rx="14" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="64" y="58" class="badge-text">⚡ AI Deal &amp; Scope Engine</text>

  <!-- Main Title & Subtitle -->
  <text x="48" y="105" class="title">Close B2B Agency Deals in <tspan fill="url(#brandGrad)">2 Hours</tspan> with Built-In Scope Protection</text>
  <text x="48" y="136" class="subtitle">Turn raw discovery notes into interactive, legally defensive proposals with automated scope creep risk detection and instant Stripe card deposits.</text>

  <!-- Comparison Architecture Cards -->
  <!-- Left Card: The Legacy Nightmare -->
  <g transform="translate(48, 175)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="510" height="195" rx="12" fill="url(#cardGradLeft)" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="20" y="18" width="110" height="24" rx="6" fill="#fee2e2"/>
    <text x="28" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#dc2626">LEGACY WORKFLOW</text>
    
    <text x="20" y="70" class="card-title" fill="#991b1b">14 Hours Manual Scoping • 4.2-Day Delay</text>
    <text x="20" y="96" class="card-text">• Endless Google Docs &amp; Word formatting headaches</text>
    <text x="20" y="118" class="card-text">• "Standard sync etc." invites unpriced client scope creep</text>
    <text x="20" y="140" class="card-text">• Static 20-page unreadable PDFs ignored on client mobile phones</text>
    <text x="20" y="162" class="card-text">• 11-day average wait for wire transfer deposit invoicing</text>
  </g>

  <!-- Center Transformation Pill -->
  <g transform="translate(574, 255)">
    <circle cx="26" cy="16" r="24" fill="#4f46e5" filter="url(#cardShadow)"/>
    <path d="M 20 16 L 32 16 M 27 10 L 33 16 L 27 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Card: DealForge AI Solution -->
  <g transform="translate(642, 175)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="510" height="195" rx="12" fill="url(#cardGradRight)" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="20" y="18" width="135" height="24" rx="6" fill="#dcfce7"/>
    <text x="28" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">DEALFORGE ENGINE</text>
    
    <text x="20" y="70" class="card-title" fill="#166534">25 Minutes Automated • 2-Hour Close</text>
    <text x="20" y="96" class="card-text">• AI formats discovery notes into deliverables &amp; milestones</text>
    <text x="20" y="118" class="card-text">• Scope Risk Radar auto-injects protective margin buffers (+25%)</text>
    <text x="20" y="140" class="card-text">• Responsive glassmorphic web viewer with live telemetry</text>
    <text x="20" y="162" class="card-text">• One-click digital signature &amp; embedded Stripe card deposit</text>
  </g>

  <!-- Bottom Proof Bar -->
  <line x1="48" y1="395" x2="1152" y2="395" stroke="#e2e8f0" stroke-width="1"/>

  <g transform="translate(48, 412)">
    <text x="0" y="24" class="stat-val" fill="#4f46e5">25 Mins</text>
    <text x="0" y="42" class="stat-lbl">Proposal Assembly</text>
  </g>

  <g transform="translate(320, 412)">
    <text x="0" y="24" class="stat-val" fill="#059669">86.2%</text>
    <text x="0" y="42" class="stat-lbl">Verified Gross Margin</text>
  </g>

  <g transform="translate(600, 412)">
    <text x="0" y="24" class="stat-val" fill="#0891b2">184+ Founders</text>
    <text x="0" y="42" class="stat-lbl">VIP Early Waitlist</text>
  </g>

  <g transform="translate(900, 412)">
    <text x="0" y="24" class="stat-val" fill="#15803d">4/4 Passed</text>
    <text x="0" y="42" class="stat-lbl">Verification Test Suites</text>
  </g>
</svg>
