<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="riskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="cardShdw" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .rm-head { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; }
    .rm-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #64748b; }
    .tier-lbl { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; font-weight: 700; }
    .tier-score { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800; }
    .tier-detail { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 12px; fill: #475569; line-height: 1.5; }
    .kw-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #be123c; }
  </style>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="1200" height="500" rx="16" fill="url(#riskBg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Title -->
  <text x="48" y="52" class="rm-head">AI Scope Risk Radar &amp; Margin Defense Matrix</text>
  <text x="48" y="78" class="rm-sub">How DealForge AI identifies high-volatility ambiguity keywords and auto-injects legally protective margin buffers.</text>

  <!-- Risk Tier 1: Low Risk -->
  <g transform="translate(48, 110)" filter="url(#cardShdw)">
    <rect x="0" y="0" width="345" height="235" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="18" y="16" width="90" height="22" rx="4" fill="#dcfce7"/>
    <text x="26" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">LOW RISK</text>
    
    <text x="18" y="72" class="tier-score" fill="#15803d">10 – 40 <tspan font-size="16" fill="#64748b">/ 100</tspan></text>
    <text x="18" y="100" class="tier-lbl" fill="#166534">+10% Margin Buffer</text>
    <text x="18" y="125" class="tier-detail">• Crystal clear deliverables</text>
    <text x="18" y="147" class="tier-detail">• Standard database schemas</text>
    <text x="18" y="169" class="tier-detail">• Documented REST APIs</text>
    <text x="18" y="191" class="tier-detail">• 2 rounds design revisions included</text>
  </g>

  <!-- Risk Tier 2: Moderate Risk -->
  <g transform="translate(427, 110)" filter="url(#cardShdw)">
    <rect x="0" y="0" width="345" height="235" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <rect x="18" y="16" width="110" height="22" rx="4" fill="#ffedd5"/>
    <text x="26" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#c2410c">MODERATE RISK</text>
    
    <text x="18" y="72" class="tier-score" fill="#c2410c">41 – 69 <tspan font-size="16" fill="#64748b">/ 100</tspan></text>
    <text x="18" y="100" class="tier-lbl" fill="#9a3412">+18% Margin Buffer</text>
    <text x="18" y="125" class="tier-detail">• External OAuth/Stripe integrations</text>
    <text x="18" y="147" class="tier-detail">• Staging environment dependency</text>
    <text x="18" y="169" class="tier-detail">• 3 business day client review SLA</text>
    <text x="18" y="191" class="tier-detail">• Additional revisions at $150/hr</text>
  </g>

  <!-- Risk Tier 3: Critical Scope Risk -->
  <g transform="translate(807, 110)" filter="url(#cardShdw)">
    <rect x="0" y="0" width="345" height="235" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <rect x="18" y="16" width="125" height="22" rx="4" fill="#fee2e2"/>
    <text x="26" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#b91c1c">CRITICAL RISK</text>
    
    <text x="18" y="72" class="tier-score" fill="#b91c1c">70 – 98 <tspan font-size="16" fill="#64748b">/ 100</tspan></text>
    <text x="18" y="100" class="tier-lbl" fill="#991b1b">+25% to +35% Buffer</text>
    <text x="18" y="125" class="tier-detail">• High ambiguity triggers detected</text>
    <text x="18" y="147" class="tier-detail">• Third-party API outage disclaimer</text>
    <text x="18" y="169" class="tier-detail">• 3-milestone escrow lock required</text>
    <text x="18" y="191" class="tier-detail">• Non-refundable sprint zero deposit</text>
  </g>

  <!-- Lower Ambiguity Keywords Bar -->
  <g transform="translate(48, 370)" filter="url(#cardShdw)">
    <rect x="0" y="0" width="1104" height="95" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">SCANNED AMBIGUITY TRIGGERS (CALIBRATED ON 5,000+ REAL AGENCY DISPUTES):</text>
    
    <!-- Keyword pills -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="100" height="28" rx="6" fill="#ffe4e6"/>
      <text x="12" y="18" class="kw-tag">"real-time"</text>

      <rect x="110" y="0" width="60" height="28" rx="6" fill="#ffe4e6"/>
      <text x="122" y="18" class="kw-tag">"ai"</text>

      <rect x="180" y="0" width="70" height="28" rx="6" fill="#ffe4e6"/>
      <text x="192" y="18" class="kw-tag">"sync"</text>

      <rect x="260" y="0" width="110" height="28" rx="6" fill="#ffe4e6"/>
      <text x="272" y="18" class="kw-tag">"seamless"</text>

      <rect x="380" y="0" width="110" height="28" rx="6" fill="#ffe4e6"/>
      <text x="392" y="18" class="kw-tag">"scalable"</text>

      <rect x="500" y="0" width="80" height="28" rx="6" fill="#ffe4e6"/>
      <text x="512" y="18" class="kw-tag">"custom"</text>

      <rect x="590" y="0" width="60" height="28" rx="6" fill="#ffe4e6"/>
      <text x="602" y="18" class="kw-tag">"etc."</text>

      <rect x="660" y="0" width="110" height="28" rx="6" fill="#ffe4e6"/>
      <text x="672" y="18" class="kw-tag">"and more"</text>

      <rect x="780" y="0" width="140" height="28" rx="6" fill="#dcfce7"/>
      <text x="792" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#15803d">✓ AUTO-PROTECTED</text>
    </g>
  </g>
</svg>
